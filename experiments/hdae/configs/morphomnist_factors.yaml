# Per-attribute sampling config for MorphoMNIST++ generation.
# Read by experiments/hdae/data/morphomnist.py (sample_targets/render) via
# scripts/preview_morphomnist.py (grid preview, no full build) and
# scripts/build_morphomnist.py (writes the full packed dataset).
#
# Edit ranges/distributions here, then re-run preview_morphomnist.py and look
# at the grid before touching build_morphomnist.py -- there is no automated
# check for "do the images still look like digits", only your eyes.

image:
  digit_size: 28   # raw MNIST digit size, fixed by the source data
  pad: 18           # per side; canvas_size = digit_size + 2*pad
  canvas_size: 64   # must equal digit_size + 2*pad -- checked at load time, not just documentation

# distribution: uniform {low, high} | normal {mean, std} | loguniform {low, high} | constant {value}
#             | gamma {shape, rate} | discrete_bins {low, high, num_bins}
# `offset`, if present on any spec, is added to the sampled value regardless of distribution.
factors:
  # --- modeled (SCM nodes: causal_graph_morpho.yaml) ---
  # thickness/intensity follow Pawlowski, Castro & Glocker 2020 ("Deep Structural Causal Models
  # for Tractable Counterfactual Inference"): t := 0.5 + Gamma(10,5); i := 191*sigmoid(0.5*eps_I +
  # 2*t - 5) + 64, eps_I ~ N(0,1) (see intensity_formula below and render()'s intensity step --
  # eps_I is `intensity_noise` here, sampled but not itself the intensity).
  thickness:
    distribution: gamma
    params: {shape: 10.0, rate: 5.0}
    offset: 0.5                            # px, average stroke half-width * 2
  intensity_noise:
    distribution: normal
    params: {mean: 0.0, std: 1.0}          # eps_I
  hue:
    distribution: uniform
    params: {low: 0.0, high: 1.0}

  # --- injected, unobserved (logged, outside the causal graph) ---
  # rotation/slant narrowed from an earlier +/-45deg (visually confirmed to sometimes destroy a
  # digit's identifying topology -- e.g. an "8" rendered as a single diagonal stroke with no
  # loops -- capping both digit and rotation/slant classification accuracy independent of
  # training). +/-30deg keeps real, observable variation without that failure mode.
  # discrete_bins (not uniform): the predictor for these is a 20-way classifier
  # (data/train_morpho_attr_predictors.py CATEGORICAL_ATTRS), and generating a continuous value
  # anywhere within a bin -- rather than exactly at its center -- leaves real intra-class pixel
  # variation the classifier can't resolve even in principle. Sampling only the 20 bin centers
  # removes that residual ambiguity; range/bin-count here MUST match CATEGORICAL_ATTRS exactly.
  slant:
    distribution: discrete_bins
    params: {low: -30.0, high: 30.0, num_bins: 10}   # degrees, shear -- coarser than rotation's 20 bins
  rotation:
    distribution: discrete_bins
    params: {low: -30.0, high: 30.0, num_bins: 20}   # degrees
  scale:
    distribution: uniform
    params: {low: 0.85, high: 1.2}         # narrowed from 0.7-1.4, same rationale as rotation/slant
  # discrete_bins, same rationale as slant/rotation above: translate_x/y are now 20-way
  # classifiers too, so generated values land exactly on the 20 bin centers.
  translate_x:
    distribution: discrete_bins
    params: {low: -10.0, high: 10.0, num_bins: 20}   # px
  translate_y:
    distribution: discrete_bins
    params: {low: -10.0, high: 10.0, num_bins: 20}   # px
  bg_freq:
    distribution: uniform
    params: {low: 1.0, high: 4.0}          # cycles across the canvas
  bg_phase:
    distribution: uniform
    params: {low: 0.0, high: 6.283185307179586}   # 2*pi
  bg_amplitude:
    distribution: uniform
    params: {low: 0.0, high: 18.0}         # 0-255 scale of the additive background field
  texture_amplitude:
    distribution: uniform
    params: {low: 0.0, high: 10.0}         # 0-255 scale of additive per-pixel noise
  # texture_seed is a per-image random integer (the noise pattern's seed), not a physical
  # quantity with a meaningful distribution -- sampled directly, not through this table.

# Fixed thickness -> intensity structural equation (Pawlowski et al. 2020), shared by every
# image -- not a per-image distribution, like causal_graph.yaml's logit_smoothing_eps.
# intensity = scale * sigmoid(noise_coef*eps_I + thickness_coef*achieved_thickness + bias) + floor
# Thicker strokes render BRIGHTER under this formula (positive thickness_coef) -- the opposite
# sign from this file's original ad-hoc linear formula, which had thicker = dimmer.
intensity_formula:
  scale: 191.0
  noise_coef: 0.5
  thickness_coef: 2.0
  bias: -5.0
  floor: 64.0
