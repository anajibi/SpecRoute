base_template: celeba64d2c_autoenc
data:
  type: morphomnist
  h5_path: "experiments/hdae/data/packed/morphomnist.h5"
  image_size: 64
  val_frac: 0.02
  preload_images: true
encoder:
  type: hierarchical
  hier_tap_block_ids: [ 0, 2, 4, 6, mid ]
  hier_level_dims: [ 103, 103, 102, 102, 102 ]
  hier_block_to_level: [ 0, 0, 0, 1, 1, 2, 2, 3, 3, 4, 4,4 ]
  n_decoder_output_blocks: 12
  n_attributes: 4
  conditioning_attrs: [ digit, thickness, intensity, hue ]
  causal_graph_path: "experiments/hdae/configs/causal_graph_morpho.yaml"
  attr_embed_dim: 128
  attr_dropout_prob: 0.0
  hier_proj: linear
conditioning:
  strategy: per_block_attr
  style_ch: 512
  latent_drop_prob: 0.0
  cfg_drop_prob: 0.1
  cfg_guidance_scale: 3.0
train:
  batch_size_per_gpu: 32
  total_batch_size: 32
  lr: 1.0e-4
  ema_decay: 0.9999
  T: 1000
  T_eval: 100
  max_steps: 150000
  precision: 16-mixed
  grad_clip: 1.0
  num_workers: 0
  compile: false
lightning:
  accelerator: gpu
  devices: 1
  strategy: cuda
  log_every_n_steps: 50
  val_check_interval: 500
seed: 42
output_dir: experiments/hdae/outputs/morpho_hier_k5
