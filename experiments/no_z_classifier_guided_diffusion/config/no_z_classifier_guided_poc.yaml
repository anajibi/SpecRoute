experiment:
  seed: 42
  num_images: 16
  batch_size: 4
  device: cuda
  output_root: experiments/no_z_classifier_guided_diffusion/outputs/poc

dataset:
  image_dir: "/home/anajibi/HDM/diffae_latent_probe/data/raw_images/celeba-hq"
  attr_path: "/home/anajibi/HDM/diffae_latent_probe/data/celeba-hq/list_attr_celeba.txt"
  partition_path: "/home/anajibi/HDM/diffae_latent_probe/data/celeba-hq/list_eval_partition.txt"
  split: test
  image_size: 256

diffusion:
  model_id: google/ddpm-celebahq-256
  # More DDIM steps improve reconstruction/edit quality at the cost of runtime.
  num_inference_steps: 700
  num_inversion_steps: 700
  # Keep DDIM predicted-x0 clipping disabled during inversion/reconstruction;
  # clipping each intermediate x0 estimate is lossy and causes severe artifacts.
  clip_sample: false
  # Optional reconstruction-only diagnostic sweep.  Add larger values (for
  # example 500 or 1000) to save extra *_ddim_reconstruction_<steps>steps.png
  # images without running classifier guidance for those diagnostic step counts.
  reconstruction_step_counts:
    - 500
  use_fp16: true
  use_amp: true

classifier:
  # Off-the-shelf pretrained CelebA attribute classifier from Hugging Face Hub.
  # The editing driver no longer trains project-local per-attribute classifiers.
  provider: hf_torchvision_state_dict
  model_id: pymlex/celeba-gan-xai
  checkpoint_filename: attribute_classifier.pt
  architecture: resnet18
  input_size: 64
  attributes:
    - Smiling
    - Eyeglasses
    - Young
    - Male
    - Blond_Hair

editing:
  target_attributes:
    - Smiling
    - Male
    - Young
    - Eyeglasses
  target_values:
    Smiling: 1
    Male: 1
    Young: 0
    Eyeglasses: 0
  guidance_scales:
    - 0.0
    - 0.1
    - 0.25
    - 0.5
    - 1.0
  # Relative guidance window; resolved against diffusion.num_inference_steps.
  # For 700 steps, 30%-90% becomes steps [210, 630).
  guidance_start_fraction: 0.30
  guidance_end_fraction: 0.90
  num_guidance_steps_per_timestep: 2
  # The normalized classifier gradient has unit RMS; applying it unscaled at
  # every DDIM step is too aggressive and creates adversarial color/texture artifacts.
  guidance_step_size: 0.005
  max_guidance_update_rms: 0.02
  gradient_smoothing_kernel: 7
  max_guided_sample_abs: 4.0
  min_guidance_alpha_cumprod: 0.01
  skip_nonfinite_guidance: true
  clamp_x0: true
  # Saves per-timestep loss/probability/gradient/update diagnostics for each
  # guided sample, useful when edited images look identical to reconstructions.
  save_guidance_diagnostics: false
  guidance_on_x0_pred: true

evaluation:
  compute_attribute_predictions: true
  compute_target_success: true
  compute_non_target_preservation: true
  compute_mse: true
  compute_ssim: false
  compute_lpips: false

visualization:
  save_grids: true
  max_visualization_images: 16
